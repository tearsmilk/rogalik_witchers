      <stop offset="0.3" stop-color="#c8ff7a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c8ff7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9fd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f3c"/>
      <stop offset="1" stop-color="#0c0814"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="190" r="260" fill="url(#moon)" opacity="0.55"/>
  <circle cx="1180" cy="190" r="70" fill="#f6efff" opacity="0.85"/>

