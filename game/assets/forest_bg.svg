<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1430"/>
      <stop offset="0.55" stop-color="#2b1f48"/>
      <stop offset="1" stop-color="#120d1f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.35" stop-color="#e9dcff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8f7cd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bdc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bdc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bdc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fly" cx="0.5" cy="0.5" r="0.5">
