name: Build macOS DMG

# Экспорт Godot-проекта идёт на Linux (так быстрее и дешевле), там же автотест игры.
# Упаковка в DMG — на macOS (hdiutil есть только там).

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # .NET 8: последняя версия, чьи бинарники запускаются на macOS 11.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Cache Godot and macOS export template
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-macos-template

      - name: Download Godot 4.7.2 (.NET) and macOS template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$T"
          unzip -q -j templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$T"
          rm templates.tpz

      - name: Import project and build C#
        working-directory: game
        run: |
          GODOT=$(ls ~/godot/*/Godot_v*_mono_linux.x86_64)
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --headless --path . --import
          dotnet build -c Debug -warnaserror

      - name: Autotest (full run with screenshots)
        working-directory: game
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p ../autotest
          xvfb-run -a -s "-screen 0 1280x800x24" "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x800 \
            -- --autotest="$PWD/../autotest" | grep AUTOTEST
          grep -q PASS ../autotest/autotest.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: autotest-screenshots
          path: autotest/
          if-no-files-found: ignore

      - name: Export macOS app (universal, macOS 11+)
        working-directory: game
        run: |
          mkdir -p ../build
          "$GODOT" --headless --path . --export-release "macOS" ../build/WitchApprentice.zip 2>&1 | tee ../build/export.log
          ! grep -E "^ERROR" ../build/export.log
          test -s ../build/WitchApprentice.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-zip
          path: build/WitchApprentice.zip
          if-no-files-found: error

  dmg:
    needs: export
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-zip
      - name: Pack DMG
        run: |
          mkdir stage
          ditto -x -k WitchApprentice.zip stage
          ln -s /Applications stage/Applications
          codesign --verify --deep --verbose=2 "stage/Witch Apprentice.app"
          hdiutil create -volname "Witch Apprentice" -srcfolder stage -fs HFS+ -format UDZO -ov "Witch-Apprentice-macOS11.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Witch-Apprentice-macOS
          path: Witch-Apprentice-macOS11.dmg
          if-no-files-found: error
